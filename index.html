<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#06040a] text-white min-h-screen flex flex-col items-center justify-center overflow-hidden relative bg-[url('image_a04527.png')] bg-cover bg-center bg-no-repeat fade-in-up">

  <div class="absolute inset-0 bg-black/60 z-0"></div>

  <main class="z-10 text-center animate-float">
    <h1 class="text-8xl md:text-9xl font-black tracking-widest text-white glow-title select-none">
      S.V
    </h1>
  </main>

  <a href="https://discord.gg/Ad9PPfB3H6" target="_blank" class="fixed bottom-6 left-6 z-20 flex items-center gap-3 bg-[#5865F2]/80 hover:bg-[#5865F2] border border-[#5865F2]/50 px-5 py-3 rounded-2xl text-white font-bold tracking-wide backdrop-blur-md shadow-[0_0_20px_rgba(88,101,242,0.4)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_0_30px_rgba(88,101,242,0.8)]">
    <i data-lucide="disc" class="w-6 h-6"></i>
    Join the discord for Links!
  </a>

  <button id="openOverlay" class="fixed bottom-6 right-6 z-20 flex items-center justify-center w-14 h-14 bg-purple-900/40 border border-purple-500/50 rounded-2xl text-purple-200 backdrop-blur-md shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all duration-500 hover:scale-110 hover:rotate-180 hover:bg-purple-600/30 hover:border-purple-400 hover:text-white hover:shadow-[0_0_30px_rgba(168,85,247,0.6)] cursor-pointer menu-spin">
    <i data-lucide="menu" class="w-7 h-7"></i>
  </button>

  <div id="overlay" class="fixed inset-0 z-30 bg-[#080511]/85 backdrop-blur-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-400">
    
    <button id="closeOverlay" class="absolute top-8 right-8 text-purple-300/70 hover:text-white hover:scale-110 transition-all duration-300 cursor-pointer">
      <i data-lucide="x" class="w-9 h-9"></i>
    </button>

    <div class="bg-[#0f0921]/70 p-8 md:p-10 rounded-3xl border border-purple-500/30 shadow-[0_0_50px_rgba(147,51,234,0.25)] flex flex-col items-center gap-6 max-w-sm w-full mx-4">
      
      <h2 class="text-xs font-bold tracking-[0.3em] uppercase text-purple-300/60 mb-2">Navigation</h2>

      <div class="grid grid-cols-2 gap-4 w-full">
        <a href="#" class="nav-card group">
          <i data-lucide="gamepad-2" class="nav-icon"></i>
          <span class="nav-label">Games</span>
        </a>

        <a href="#" class="nav-card group">
          <i data-lucide="clapperboard" class="nav-icon"></i>
          <span class="nav-label">Movies</span>
        </a>

        <a href="html/browse.html" class="nav-card group">
          <i data-lucide="compass" class="nav-icon"></i>
          <span class="nav-label">Browse</span>
        </a>

        <a href="#" class="nav-card group">
          <i data-lucide="message-square" class="nav-icon"></i>
          <span class="nav-label">Chat</span>
        </a>
      </div>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
