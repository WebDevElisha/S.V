<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#06040a] text-white h-screen flex flex-col relative bg-[url('Background.png')] bg-cover bg-center bg-no-repeat overflow-hidden">
  <div class="absolute inset-0 bg-black/75 z-0"></div>

  <header class="relative z-20 grid grid-cols-[1fr_auto_1fr] items-center px-6 py-4 bg-[#0f0921]/90 backdrop-blur-xl border-b border-purple-500/30 shadow-[0_4px_30px_rgba(147,51,234,0.2)]">
    <div></div>
    <nav class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-600/30 border border-purple-400/50 text-white font-bold text-xs uppercase tracking-wider shadow-[0_0_15px_rgba(168,85,247,0.3)] transition-all">
        <i data-lucide="home" class="w-4 h-4"></i>
        Home
      </a>
      <a href="html/browse.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="globe" class="w-4 h-4"></i>
        Browse
      </a>
      <a href="html/chat.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="message-square" class="w-4 h-4"></i>
        Chat
      </a>
      <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="gamepad-2" class="w-4 h-4"></i>
        Games
      </a>
      <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="clapperboard" class="w-4 h-4"></i>
        Movies
      </a>
    </nav>
    <div class="flex justify-end">
      <a href="https://discord.gg/Ad9PPfB3H6" target="_blank" class="flex items-center gap-2 bg-[#5865F2]/80 hover:bg-[#5865F2] border border-[#5865F2]/50 px-4 py-2 rounded-2xl text-white font-bold text-xs uppercase tracking-wider backdrop-blur-md shadow-[0_0_20px_rgba(88,101,242,0.4)] transition-all">
        <i data-lucide="disc" class="w-4 h-4"></i>
        Discord
      </a>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center relative z-10 px-6">
    <div class="flex flex-col items-center w-full max-w-2xl gap-10">
      <h1 class="text-8xl md:text-[10rem] font-black tracking-widest text-white glow-title select-none">S.V</h1>
      
      <div class="w-full flex items-center bg-[#06040a]/80 border border-purple-500/40 rounded-full px-8 py-5 backdrop-blur-xl shadow-[0_0_40px_rgba(147,51,234,0.3)] transition-all focus-within:border-purple-400 focus-within:shadow-[0_0_50px_rgba(168,85,247,0.5)]">
        <i data-lucide="search" class="w-6 h-6 text-purple-400 mr-4"></i>
        <input id="home-search" type="text" placeholder="Search with DuckDuckGo or enter URL..." class="bg-transparent w-full outline-none text-lg text-purple-100 placeholder-purple-500/50 font-medium tracking-wide">
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const homeSearch = document.getElementById('home-search');
      if (homeSearch) {
        homeSearch.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.target.value.trim()) {
            window.location.href = 'html/browse.html?q=' + encodeURIComponent(e.target.value.trim());
          }
        });
        homeSearch.focus();
      }
    });
  </script>
</body>
</html>
