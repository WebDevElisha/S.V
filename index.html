<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#06040a] text-white min-h-screen flex flex-col items-center justify-between p-6 overflow-hidden relative bg-[url('background.png')] bg-cover bg-center bg-no-repeat fade-in-up">
  <div class="absolute inset-0 bg-black/60 z-0"></div>

  <a href="https://discord.gg/Ad9PPfB3H6" target="_blank" class="fixed top-6 left-6 z-20 flex items-center gap-3 bg-[#5865F2]/80 hover:bg-[#5865F2] border border-[#5865F2]/50 px-5 py-3 rounded-2xl text-white font-bold tracking-wide backdrop-blur-md shadow-[0_0_20px_rgba(88,101,242,0.4)] transition-all duration-300 hover:-translate-y-1">
    <i data-lucide="disc" class="w-6 h-6"></i>
    Join the discord for more links!
  </a>

  <main class="z-10 flex flex-col items-center justify-center flex-1 w-full max-w-2xl gap-8">
    <h1 class="text-8xl md:text-9xl font-black tracking-widest text-white glow-title select-none animate-float">S.V</h1>
    
    <form id="home-search-form" class="w-full flex items-center bg-[#0a0614]/80 border border-purple-500/40 rounded-2xl px-6 py-4 backdrop-blur-xl shadow-[0_0_30px_rgba(147,51,234,0.3)]">
      <i data-lucide="search" class="w-5 h-5 text-purple-400 mr-4"></i>
      <input id="home-search-input" type="text" placeholder="Search with DuckDuckGo..." class="bg-transparent w-full outline-none text-base text-purple-100 placeholder-purple-500/50 font-medium tracking-wide">
    </form>
  </main>

  <footer class="z-10 flex items-center justify-center gap-6 pb-4">
    <a href="html/browse.html?site=instagram" class="flex flex-col items-center gap-2 group">
      <div class="w-16 h-16 rounded-full bg-purple-950/60 border border-purple-500/40 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(168,85,247,0.2)] transition-all duration-300 group-hover:scale-110 group-hover:bg-purple-600/40 group-hover:border-purple-300">
        <i data-lucide="camera" class="w-7 h-7 text-purple-200 group-hover:text-white"></i>
      </div>
      <span class="text-xs font-bold tracking-wider text-purple-300/80 group-hover:text-white uppercase">Instagram</span>
    </a>

    <a href="html/browse.html?site=discord" class="flex flex-col items-center gap-2 group">
      <div class="w-16 h-16 rounded-full bg-purple-950/60 border border-purple-500/40 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(168,85,247,0.2)] transition-all duration-300 group-hover:scale-110 group-hover:bg-purple-600/40 group-hover:border-purple-300">
        <i data-lucide="message-square" class="w-7 h-7 text-purple-200 group-hover:text-white"></i>
      </div>
      <span class="text-xs font-bold tracking-wider text-purple-300/80 group-hover:text-white uppercase">Discord</span>
    </a>

    <a href="html/browse.html?site=snapchat" class="flex flex-col items-center gap-2 group">
      <div class="w-16 h-16 rounded-full bg-purple-950/60 border border-purple-500/40 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(168,85,247,0.2)] transition-all duration-300 group-hover:scale-110 group-hover:bg-purple-600/40 group-hover:border-purple-300">
        <i data-lucide="ghost" class="w-7 h-7 text-purple-200 group-hover:text-white"></i>
      </div>
      <span class="text-xs font-bold tracking-wider text-purple-300/80 group-hover:text-white uppercase">Snapchat</span>
    </a>

    <a href="html/browse.html?site=github" class="flex flex-col items-center gap-2 group">
      <div class="w-16 h-16 rounded-full bg-purple-950/60 border border-purple-500/40 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(168,85,247,0.2)] transition-all duration-300 group-hover:scale-110 group-hover:bg-purple-600/40 group-hover:border-purple-300">
        <i data-lucide="github" class="w-7 h-7 text-purple-200 group-hover:text-white"></i>
      </div>
      <span class="text-xs font-bold tracking-wider text-purple-300/80 group-hover:text-white uppercase">Github</span>
    </a>
  </footer>

  <button id="openOverlay" class="fixed bottom-6 right-6 z-30 flex items-center justify-center w-14 h-14 bg-purple-900/40 border border-purple-500/50 rounded-2xl text-purple-200 backdrop-blur-md shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all duration-500 hover:scale-110 hover:rotate-180 hover:bg-purple-600/30 hover:border-purple-400 hover:text-white hover:shadow-[0_0_30px_rgba(168,85,247,0.6)] cursor-pointer menu-spin">
    <i data-lucide="layout-grid" class="w-7 h-7"></i>
  </button>

  <div id="overlay" class="fixed inset-0 z-40 bg-[#080511]/85 backdrop-blur-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-400">
    <button id="closeOverlay" class="absolute top-8 right-8 text-purple-300/70 hover:text-white hover:scale-110 transition-all duration-300 cursor-pointer">
      <i data-lucide="x" class="w-9 h-9"></i>
    </button>
    <div class="bg-[#0f0921]/70 p-8 md:p-10 rounded-3xl border border-purple-500/30 shadow-[0_0_50px_rgba(147,51,234,0.25)] flex flex-col items-center gap-6 max-w-md w-full mx-4">
      <h2 class="text-xs font-bold tracking-[0.3em] uppercase text-purple-300/60 mb-2">Navigation</h2>
      <div class="grid grid-cols-3 gap-4 w-full">
        <a href="index.html" class="nav-card group"><i data-lucide="home" class="nav-icon"></i><span class="nav-label">Home</span></a>
        <a href="html/browse.html" class="nav-card group"><i data-lucide="compass" class="nav-icon"></i><span class="nav-label">Browse</span></a>
        <a href="html/chat.html" class="nav-card group"><i data-lucide="message-square" class="nav-icon"></i><span class="nav-label">Chat</span></a>
        <a href="#" class="nav-card group"><i data-lucide="gamepad-2" class="nav-icon"></i><span class="nav-label">Games</span></a>
        <a href="#" class="nav-card group"><i data-lucide="clapperboard" class="nav-icon"></i><span class="nav-label">Movies</span></a>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
