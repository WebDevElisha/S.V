<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V - Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/chat.css">
</head>
<body class="bg-[#06040a] text-white h-screen flex relative bg-[url('../Background.png')] bg-cover bg-center bg-no-repeat overflow-hidden">
  <div class="absolute inset-0 bg-black/75 z-0"></div>

  <aside class="w-20 bg-[#0f0921]/95 border-r border-purple-500/30 backdrop-blur-2xl flex flex-col items-center py-8 gap-6 z-20">
    <a href="../index.html" class="p-3 rounded-2xl text-purple-400 hover:text-white hover:bg-purple-900/40 transition-all group">
      <i data-lucide="home" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
    </a>
    <a href="browse.html" class="p-3 rounded-2xl text-purple-400 hover:text-white hover:bg-purple-900/40 transition-all group">
      <i data-lucide="globe" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
    </a>
    <a href="chat.html" class="p-3 rounded-2xl bg-purple-600/30 text-white border border-purple-400/50 shadow-[0_0_15px_rgba(168,85,247,0.3)] group transition-all">
      <i data-lucide="message-square" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
    </a>
    <a href="#" class="p-3 rounded-2xl text-purple-400 hover:text-white hover:bg-purple-900/40 transition-all group">
      <i data-lucide="gamepad-2" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
    </a>
    <a href="#" class="p-3 rounded-2xl text-purple-400 hover:text-white hover:bg-purple-900/40 transition-all group">
      <i data-lucide="clapperboard" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
    </a>
  </aside>

  <main class="flex-1 p-6 relative z-10 h-full flex flex-col max-w-7xl mx-auto w-full">
    <div class="flex-1 flex rounded-3xl border border-purple-500/30 bg-[#0a0614]/70 backdrop-blur-xl overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.2)]">
      
      <div class="w-64 border-r border-purple-500/30 bg-[#0f0921]/40 p-4 flex flex-col justify-between">
        <div class="flex flex-col gap-4">
          <h2 class="text-xs font-bold tracking-[0.25em] uppercase text-purple-400/70 px-2 pt-2">Rooms</h2>
          <div class="flex flex-col gap-1">
            <button class="flex items-center gap-3 px-3 py-3 rounded-2xl bg-purple-600/30 border border-purple-400/50 text-white font-bold text-sm tracking-wide text-left w-full shadow-[0_0_15px_rgba(168,85,247,0.3)]">
              <i data-lucide="hash" class="w-4 h-4 text-purple-300"></i>
              Global Chat
            </button>
          </div>
        </div>
        <div class="flex flex-col gap-2 pt-4 border-t border-purple-500/20">
          <button class="flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-purple-950/60 border border-purple-500/40 hover:bg-purple-600/40 text-purple-200 hover:text-white text-xs font-bold tracking-wide transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Create Room
          </button>
        </div>
      </div>

      <div class="flex-1 flex flex-col">
        <header class="px-6 py-4 border-b border-purple-500/30 bg-[#0f0921]/40 flex items-center justify-between">
          <h1 class="text-lg font-black tracking-wider text-white glow-title">Global Chat</h1>
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-purple-950/40 border border-purple-500/30 text-xs font-bold text-purple-300">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            Online
          </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
        </div>

        <div class="p-5 border-t border-purple-500/30 bg-[#0f0921]/60">
          <div class="flex items-center bg-[#06040a] border border-purple-500/40 rounded-full px-5 py-3 shadow-[0_0_20px_rgba(147,51,234,0.15)] focus-within:border-purple-400 transition-all">
            <input type="text" placeholder="Message #global-chat..." class="bg-transparent w-full outline-none text-sm text-purple-100 placeholder-purple-500/50 font-medium tracking-wide">
            <button class="text-purple-400 hover:text-white p-2 rounded-full hover:bg-purple-600/30 transition-all ml-2">
              <i data-lucide="send" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="../js/script.js"></script>
</body>
</html>
