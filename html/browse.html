<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V - Browse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#06040a] text-white h-screen flex relative bg-[url('../Background.png')] bg-cover bg-center bg-no-repeat overflow-hidden">
  <div class="absolute inset-0 bg-black/60 z-0"></div>

  <main class="flex-1 flex flex-col p-4 gap-4 relative z-10 h-full overflow-hidden w-full mx-auto">

    <header class="flex items-center gap-3 bg-[#0f0921]/70 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-2.5 shadow-[0_4px_30px_rgba(147,51,234,0.2)] shrink-0">

      <div class="flex items-center gap-1 pr-3 border-r border-purple-500/30 text-purple-300 shrink-0">
        <a href="../index.html" class="hover:text-white hover:bg-purple-600/30 p-2 rounded-xl transition-all" title="Back to Home">
          <i data-lucide="home" class="w-5 h-5"></i>
        </a>
        <button id="btn-back" class="hover:text-white hover:bg-purple-600/30 p-2 rounded-xl transition-all" title="Back">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <button id="btn-forward" class="hover:text-white hover:bg-purple-600/30 p-2 rounded-xl transition-all" title="Forward">
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
        <button id="btn-reload" class="hover:text-white hover:bg-purple-600/30 p-2 rounded-xl transition-all" title="Reload">
          <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="tabs-list" class="flex-1 flex items-center gap-2 overflow-x-auto no-scrollbar px-1">

      </div>
      
      <div class="flex items-center gap-2 pl-3 border-l border-purple-500/30 shrink-0 text-purple-300">
        <button id="add-tab-btn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-purple-600/30 border border-purple-400/40 hover:bg-purple-600/60 text-white transition-all shadow-[0_0_10px_rgba(168,85,247,0.3)]" title="New Tab">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
        <button id="btn-fullscreen" class="hover:text-white hover:bg-purple-600/30 p-2 rounded-xl transition-all" title="Toggle Fullscreen">
          <i data-lucide="maximize" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <section class="flex-1 bg-[#0a0614]/40 border border-purple-500/30 rounded-3xl backdrop-blur-md shadow-[0_0_40px_rgba(147,51,234,0.2)] flex flex-col overflow-hidden relative">
      
      <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-transparent z-20 p-6">
        <div class="flex flex-col items-center text-center max-w-xl w-full gap-8">
          <h1 class="text-7xl md:text-8xl font-black tracking-widest text-white glow-title select-none">S.V</h1>

          <div class="w-full flex items-center bg-[#06040a]/80 border border-purple-500/40 rounded-full px-6 py-4 backdrop-blur-xl shadow-[0_0_30px_rgba(147,51,234,0.3)] focus-within:border-purple-400 transition-all">
            <i data-lucide="search" class="w-5 h-5 text-purple-400 mr-4"></i>
            <input id="url-input" type="text" placeholder="Search with DuckDuckGo or enter URL..." class="bg-transparent w-full outline-none text-base text-purple-100 placeholder-purple-500/50 font-medium tracking-wide">
          </div>
        </div>
      </div>

      <iframe id="browser-frame" class="w-full flex-1 border-none hidden z-10 bg-white" src=""></iframe>
    </section>
  </main>

  <script src="../js/script.js"></script>
  <script src="../js/browse.js"></script>
</body>
</html>
