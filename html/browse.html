<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V - Browse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/browse.css">
</head>
<body class="bg-[#06040a] text-white min-h-screen flex flex-col relative bg-[url('../background.png')] bg-cover bg-center bg-no-repeat fade-in-up">
  <div class="absolute inset-0 bg-black/70 z-0"></div>

  <header id="floating-header" class="fixed top-4 left-1/2 -translate-x-1/2 z-40 w-[95%] max-w-5xl bg-[#0f0921]/90 backdrop-blur-xl border border-purple-500/40 rounded-2xl shadow-[0_0_40px_rgba(147,51,234,0.3)] flex flex-col transition-all duration-300">
    <div class="flex items-center justify-between px-3 pt-2 bg-[#0a0614]/80 rounded-t-2xl border-b border-purple-500/20">
      <div id="tabs-list" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
      <div class="flex items-center gap-1">
        <button id="add-tab-btn" class="text-purple-400 hover:text-white hover:bg-purple-500/20 p-1.5 rounded-lg transition-all">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
        <button id="toggle-header" class="text-purple-400 hover:text-white hover:bg-purple-500/20 p-1.5 rounded-lg transition-all ml-2">
          <i data-lucide="chevron-up" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <div id="header-controls" class="flex items-center gap-4 p-3 bg-[#130b29]/80 rounded-b-2xl">
      <div class="flex items-center gap-2 text-purple-300">
        <button id="btn-back" class="hover:text-white hover:bg-purple-500/20 p-2 rounded-lg transition-all nav-btn">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <button id="btn-forward" class="hover:text-white hover:bg-purple-500/20 p-2 rounded-lg transition-all nav-btn">
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
        <button id="btn-reload" class="hover:text-white hover:bg-purple-500/20 p-2 rounded-lg transition-all nav-btn">
          <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex-1 flex items-center bg-[#0a0614] border border-purple-500/40 rounded-xl px-5 py-2 search-bar-inner">
        <i data-lucide="search" class="w-4 h-4 text-purple-400 mr-3"></i>
        <input id="url-input" type="text" placeholder="Search with DuckDuckGo or enter address" class="bg-transparent w-full outline-none text-sm text-purple-100 placeholder-purple-500/50 font-medium tracking-wide">
      </div>
    </div>
  </header>

  <main class="relative z-10 w-full flex-1 flex flex-col pt-28 h-screen">
    <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-[#06040a]/80 z-20">
      <div class="animate-float text-center">
        <h1 class="text-8xl md:text-9xl font-black tracking-widest text-white glow-title select-none mb-4">S.V</h1>
        <p class="text-purple-300 tracking-[0.25em] uppercase text-sm font-bold drop-shadow-[0_0_10px_rgba(168,85,247,0.8)] bg-black/40 px-6 py-2 rounded-full border border-purple-500/20 inline-block">browse thru S.V!</p>
      </div>
    </div>
    <iframe id="browser-frame" class="w-full flex-1 border-none hidden z-10 bg-white" src=""></iframe>
  </main>

  <script src="../js/script.js"></script>
  <script src="../js/browse.js"></script>
</body>
</html>
